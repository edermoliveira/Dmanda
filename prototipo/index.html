<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo Dmanda: 4 temas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Space+Grotesk:wght@500;700&family=Playfair+Display:wght@600;700&family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=DM+Mono:wght@400;500&family=Space+Mono:wght@400;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="v3.css">
<link rel="stylesheet" href="v4.css">
<link rel="stylesheet" href="catalyst.css">
</head>
<body>
<div class="ctl" role="toolbar" aria-label="Controles do protótipo">
  <p class="ctl-t">Dmanda: protótipo</p>
  <div class="grp" id="g-dir"><span>Tema</span>
    <button class="seg" data-dir="a" aria-pressed="true">A Aurora</button>
    <button class="seg" data-dir="b" aria-pressed="false">B Papel</button>
    <button class="seg" data-dir="c" aria-pressed="false">C Grafite</button>
    <button class="seg" data-dir="d" aria-pressed="false">D Catalyst</button>
  </div>
  <div class="grp" id="g-tema"><span>Modo</span>
    <button class="seg" data-tema="claro" aria-pressed="true">Claro</button>
    <button class="seg" data-tema="escuro" aria-pressed="false">Escuro</button>
  </div>
  <div class="grp" id="g-dev"><span>Tela</span>
    <button class="seg" data-dev="desktop" data-w="1360" data-h="780" aria-pressed="true">Computador</button>
    <button class="seg" data-dev="tablet-h" data-w="1180" data-h="780" aria-pressed="false">iPad horizontal</button>
    <button class="seg" data-dev="media" data-w="1000" data-h="780" aria-pressed="false">Janela média</button>
    <button class="seg" data-dev="tablet-v" data-w="820" data-h="900" aria-pressed="false">iPad vertical</button>
    <button class="seg" data-dev="phone" data-w="390" data-h="800" aria-pressed="false">Celular</button>
  </div>
</div>
<p class="nota-dir" id="nota-dir"></p>
<div class="stage"><div class="frame" id="frame"></div></div>
<script src="icones.js"></script>
<script src="icones-iconoir.js"></script>
<script src="extra.js"></script>
<script src="app.js"></script>
<script src="catalyst.js"></script>
</body>
</html>
